<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Yönetimi - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .admin-header h2 { font-size:1.3rem; display:flex; align-items:center; gap:10px; }
        .repos-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }
        .repo-card { padding:20px; position:relative; }
        .repo-card h3 { font-size:1.05rem; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
        .repo-card .repo-url { font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--text-muted); margin-bottom:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .repo-card .repo-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .repo-card .repo-actions { display:flex; gap:8px; }
        .repo-card .card-badge { position:absolute; top:14px; right:14px; }

        .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:15px; border-top:1px solid var(--border-color); }

        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .empty-state .icon { font-size:3rem; opacity:0.3; margin-bottom:12px; }

        .type-hint { font-size:0.75rem; color:var(--text-muted); margin-top:4px; padding:8px; background:var(--bg-tertiary); border-radius:6px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left"><h1 class="page-title">🔧 Repository Yönetimi</h1></div>
                <div class="header-right"><button class="theme-toggle" onclick="Theme.toggle()">🌙</button></div>
            </header>

            <div class="page-content">
                <div class="admin-header">
                    <h2>Repository'ler</h2>
                    <button class="btn btn-primary" onclick="openRepoModal()">
                        <span class="material-icons-round" style="font-size:1rem;">add</span> Yeni Repository
                    </button>
                </div>

                <div class="repos-grid" id="reposGrid">
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="icon">📦</div>
                        <p>Yükleniyor...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Repo Modal -->
    <div class="modal-overlay" id="repoModal">
        <div class="modal">
            <h3 id="modalTitle" style="margin:0 0 20px;">Yeni Repository</h3>
            <input type="hidden" id="editRepoId">

            <div class="form-group">
                <label class="form-label">Repository Adı</label>
                <input type="text" class="form-input" id="inputName" placeholder="My Web Tests">
            </div>

            <div class="form-group">
                <label class="form-label">Git URL</label>
                <input type="text" class="form-input" id="inputUrl" placeholder="https://github.com/user/repo.git">
            </div>

            <div class="form-group">
                <label class="form-label">Açıklama</label>
                <input type="text" class="form-input" id="inputDescription" placeholder="Kısa açıklama (opsiyonel)">
            </div>

            <div class="form-group">
                <label class="form-label">Git Platform</label>
                <select class="form-select" id="inputType">
                    <option value="github">GitHub</option>
                    <option value="azure">Azure DevOps</option>
                    <option value="gitlab">GitLab</option>
                    <option value="bitbucket">Bitbucket</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Branch</label>
                <input type="text" class="form-input" id="inputBranch" placeholder="main" value="main">
            </div>

            <div class="form-group">
                <label class="form-label">Repository Tipi (Test Türü)</label>
                <select class="form-select" id="inputRepoType" onchange="onRepoTypeChange()">
                    <option value="web-selenium">🌐 Web (Selenium)</option>
                    <option value="mobile-android">📲 Mobil (Android)</option>
                    <option value="mobile-ios">📱 Mobil (iOS)</option>
                    <option value="desktop">🖥️ Desktop (PyAutoGUI)</option>
                    <option value="web-desktop">🌐🖥️ Web + Desktop (Hibrit)</option>
                    <option value="api">🔗 API Test</option>
                </select>
                <div class="type-hint" id="repoTypeHint">
                    Selenium ile web otomasyon senaryoları. Normal editör kullanılır.
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Editör Tipi</label>
                <select class="form-select" id="inputEditorType">
                    <option value="normal">📝 Normal Editör (Kod tabanlı)</option>
                    <option value="advanced">🎯 Advanced Editör (Image/Screenshot tabanlı)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Git Token (opsiyonel)</label>
                <input type="password" class="form-input" id="inputToken" placeholder="ghp_xxxx veya PAT">
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeRepoModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveRepo()">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
    (function() {
        "use strict";

        let allRepos = [];

        const TYPE_ICONS = {
            "web-selenium": "🌐", "mobile-android": "📲", "mobile-ios": "📱",
            "desktop": "🖥️", "web-desktop": "🌐🖥️", "api": "🔗",
            "web": "🌐", "mobile": "📲"
        };

        const TYPE_HINTS = {
            "web-selenium": "Selenium ile web otomasyon senaryoları. Normal editör kullanılır.",
            "mobile-android": "Appium ile Android mobil test senaryoları. Normal editör kullanılır.",
            "mobile-ios": "Appium ile iOS mobil test senaryoları. Normal editör kullanılır.",
            "desktop": "PyAutoGUI ile desktop otomasyon. Screenshot tabanlı Advanced editör önerilir.",
            "web-desktop": "Hibrit web + desktop otomasyonu. Advanced editör önerilir.",
            "api": "API test senaryoları. Normal editör kullanılır."
        };

        document.addEventListener("DOMContentLoaded", async () => {
            if (!Auth.checkAuth()) return;
            if (!Auth.isAdmin()) { Toast.error("Yetkiniz yok"); location.href = "index.html"; return; }
            await loadRepos();
        });

        async function loadRepos() {
            try {
                const data = await API.get("/admin/repositories");
                allRepos = data.repositories || data || [];
                renderRepos();
            } catch (e) {
                document.getElementById("reposGrid").innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>Yükleme hatası: ${e.message}</p></div>`;
            }
        }

        function renderRepos() {
            const grid = document.getElementById("reposGrid");
            if (!allRepos.length) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📦</div><h3>Henüz repository yok</h3><p>"Yeni Repository" butonu ile başlayın.</p></div>';
                return;
            }

            grid.innerHTML = allRepos.map(r => {
                const icon = TYPE_ICONS[r.repository_type || r.type] || "📦";
                const editorLabel = r.editor_type === "advanced" ? "🎯 Advanced" : "📝 Normal";
                return `
                <div class="card repo-card">
                    <div class="card-badge"><span class="badge badge-info">${editorLabel}</span></div>
                    <h3>${icon} ${escapeHtml(r.name)}</h3>
                    <div class="repo-url">${escapeHtml(r.url || r.repo_url)}</div>
                    <div class="repo-meta">
                        <span class="badge badge-info">${r.repository_type || r.type || '-'}</span>
                        <span class="badge badge-success">${r.branch || 'main'}</span>
                        <span class="badge" style="background:var(--bg-tertiary); color:var(--text-muted);">${r.git_type || r.platform || 'github'}</span>
                    </div>
                    ${r.description ? `<p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">${escapeHtml(r.description)}</p>` : ''}
                    <div class="repo-actions">
                        <button class="btn btn-secondary btn-sm" onclick="openRepoModal(${r.id})">
                            <span class="material-icons-round" style="font-size:0.9rem;">edit</span> Düzenle
                        </button>
                        <button class="btn btn-ghost btn-sm" onclick="deleteRepo(${r.id})" style="color:var(--danger);">
                            <span class="material-icons-round" style="font-size:0.9rem;">delete</span> Sil
                        </button>
                    </div>
                </div>`;
            }).join("");
        }

        // ========== MODAL ==========
        window.openRepoModal = function(repoId = null) {
            document.getElementById("editRepoId").value = repoId || "";
            document.getElementById("modalTitle").textContent = repoId ? "Repository Düzenle" : "Yeni Repository";

            if (repoId) {
                const r = allRepos.find(x => x.id === repoId);
                if (r) {
                    document.getElementById("inputName").value = r.name || "";
                    document.getElementById("inputUrl").value = r.url || r.repo_url || "";
                    document.getElementById("inputDescription").value = r.description || "";
                    document.getElementById("inputType").value = r.git_type || r.platform || "github";
                    document.getElementById("inputBranch").value = r.branch || "main";
                    document.getElementById("inputRepoType").value = r.repository_type || "web-selenium";
                    document.getElementById("inputEditorType").value = r.editor_type || "normal";
                    document.getElementById("inputToken").value = "";
                }
            } else {
                document.getElementById("inputName").value = "";
                document.getElementById("inputUrl").value = "";
                document.getElementById("inputDescription").value = "";
                document.getElementById("inputType").value = "github";
                document.getElementById("inputBranch").value = "main";
                document.getElementById("inputRepoType").value = "web-selenium";
                document.getElementById("inputEditorType").value = "normal";
                document.getElementById("inputToken").value = "";
            }
            onRepoTypeChange();
            document.getElementById("repoModal").classList.add("active");
        };

        window.closeRepoModal = function() {
            document.getElementById("repoModal").classList.remove("active");
        };

        window.onRepoTypeChange = function() {
            const repoType = document.getElementById("inputRepoType").value;
            const editorSelect = document.getElementById("inputEditorType");
            const hint = document.getElementById("repoTypeHint");

            hint.textContent = TYPE_HINTS[repoType] || "";

            // Desktop ve web-desktop => otomatik advanced öner
            if (repoType === "desktop" || repoType === "web-desktop") {
                editorSelect.value = "advanced";
            } else {
                editorSelect.value = "normal";
            }
        };

        window.saveRepo = async function() {
            const repoId = document.getElementById("editRepoId").value;
            const data = {
                name: document.getElementById("inputName").value.trim(),
                url: document.getElementById("inputUrl").value.trim(),
                description: document.getElementById("inputDescription").value.trim(),
                type: document.getElementById("inputType").value,
                branch: document.getElementById("inputBranch").value.trim() || "main",
                repository_type: document.getElementById("inputRepoType").value,
                editor_type: document.getElementById("inputEditorType").value
            };

            const token = document.getElementById("inputToken").value.trim();
            if (token) data.token = token;

            if (!data.name) { Toast.error("Repository adı gerekli"); return; }
            if (!data.url) { Toast.error("Git URL gerekli"); return; }

            try {
                if (repoId) {
                    await API.put(`/admin/repositories/${repoId}`, data);
                    Toast.success("Repository güncellendi");
                } else {
                    await API.post("/admin/repositories", data);
                    Toast.success("Repository oluşturuldu");
                }
                closeRepoModal();
                loadRepos();
            } catch (e) { Toast.error(e.message); }
        };

        window.deleteRepo = async function(repoId) {
            const r = allRepos.find(x => x.id === repoId);
            if (!confirm(`"${r?.name}" repository'sini silmek istediğinize emin misiniz?`)) return;
            try {
                await API.delete(`/admin/repositories/${repoId}`);
                Toast.success("Repository silindi");
                loadRepos();
            } catch (e) { Toast.error(e.message); }
        };

        function escapeHtml(t) { if (!t) return ""; const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
    })();
    </script>
</body>
</html>
