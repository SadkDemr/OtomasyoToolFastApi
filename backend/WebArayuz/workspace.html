<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace - Test Otomasyon Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">💼 Git Workspace</h1>
                    <p style="margin:6px 0 0; color:var(--text-muted); font-size:0.9rem;">Repository'leri clone edin, commit ve push yapın</p>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="Theme.toggle()">🌙</button>
                </div>
            </header>
            
            <div class="page-content">
                <!-- Tabs -->
                <div style="display:flex; gap:8px; margin-bottom:24px; border-bottom:2px solid var(--border-color);">
                    <button class="tab-btn active" data-tab="catalog" style="padding:12px 24px; border:none; background:none; border-bottom:3px solid var(--accent-primary); font-weight:600; color:var(--accent-primary); cursor:pointer;">
                        📚 Repo Kataloğu
                    </button>
                    <button class="tab-btn" data-tab="my-workspace" style="padding:12px 24px; border:none; background:none; border-bottom:3px solid transparent; font-weight:600; color:var(--text-muted); cursor:pointer;">
                        💼 Benim Workspace
                    </button>
                </div>

                <div class="tab-content" id="catalog-tab">
                    <div id="catalogContainer">
                        <div style="text-align:center; padding:40px; color:var(--text-muted);">Katalog yükleniyor...</div>
                    </div>
                </div>

                <div class="tab-content" id="my-workspace-tab" style="display:none;">
                    <div id="workspaceContainer">
                        <div style="text-align:center; padding:40px; color:var(--text-muted);">Workspace'ler yükleniyor...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
    (function() {
        "use strict";
        
        if (!Auth.checkAuth()) return;

        const catalogContainer = document.getElementById("catalogContainer");
        const workspaceContainer = document.getElementById("workspaceContainer");

        // Tab Switching
        document.querySelectorAll(".tab-btn").forEach(tab => {
            tab.addEventListener("click", () => {
                const target = tab.dataset.tab;
                document.querySelectorAll(".tab-btn").forEach(t => {
                    t.classList.remove("active");
                    t.style.borderBottomColor = "transparent";
                    t.style.color = "var(--text-muted)";
                });
                document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
                tab.classList.add("active");
                tab.style.borderBottomColor = "var(--accent-primary)";
                tab.style.color = "var(--accent-primary)";
                document.getElementById(target + "-tab").style.display = "block";
            });
        });

        const TYPE_ICONS = {
            "mobile-ios": "📱", "mobile-android": "🤖", "mobile": "📲",
            "web": "🌐", "web-selenium": "🌐",
            "desktop": "🖥️", "web-desktop": "🌐🖥️",
            "api": "🔗"
        };

        // ===== Route to correct page based on repository type =====
        function getTargetPage(repoType) {
            if (["desktop", "web-desktop"].includes(repoType)) return "desktop-test.html";
            if (["mobile", "mobile-android", "mobile-ios"].includes(repoType)) return "mobile-test.html";
            return "web-test.html";
        }

        // ===== CATALOG =====
        async function loadCatalog() {
            try {
                const data = await API.get("/workspaces/catalog");
                renderCatalog(data.catalog || []);
            } catch (err) {
                catalogContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Katalog yüklenemedi: ${err.message}</div>`;
            }
        }

        function renderCatalog(repos) {
            if (!repos.length) {
                catalogContainer.innerHTML = `
                    <div style="text-align:center; padding:60px; color:var(--text-muted);">
                        <div style="font-size:3rem; opacity:0.3; margin-bottom:12px;">📚</div>
                        <h3>Henüz repo yok</h3>
                        <p>Admin kullanıcı henüz repository eklemedi.</p>
                    </div>`;
                return;
            }

            catalogContainer.innerHTML = `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">
                ${repos.map(r => {
                    const icon = TYPE_ICONS[r.repo_type] || "📦";
                    const cloned = r.is_cloned_by_me;
                    return `
                    <div class="card" style="padding:20px;">
                        <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                            <div style="font-size:2rem;">${icon}</div>
                            <div style="flex:1; min-width:0;">
                                <h3 style="margin:0; font-size:1rem;">${escapeHtml(r.name)}</h3>
                                <div style="font-size:0.75rem; color:var(--text-muted); font-family:monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(r.repo_url)}</div>
                            </div>
                        </div>
                        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">${escapeHtml(r.description || "Açıklama yok")}</p>
                        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                            ${cloned ? '<span class="badge badge-success">✓ Clone edildi</span>' : ''}
                            ${cloned
                                ? `<button class="btn btn-secondary btn-sm" onclick="openWorkspace(${r.my_workspace_id}, '${r.repo_type}')">Aç</button>`
                                : `<button class="btn btn-primary btn-sm" onclick="cloneRepo(${r.id})">Clone</button>`
                            }
                        </div>
                    </div>`;
                }).join("")}
            </div>`;
        }

        window.cloneRepo = async function(repoId) {
            if (!confirm("Bu repository workspace'inize clone'lanacak. Devam?")) return;
            try {
                await API.post("/workspaces/clone", { repository_id: repoId });
                Toast.success("Clone başlatıldı...");
                setTimeout(() => { loadCatalog(); loadMyWorkspaces(); }, 3000);
            } catch (err) { Toast.error("Clone hatası: " + err.message); }
        };

        window.openWorkspace = function(workspaceId, repoType) {
            const page = getTargetPage(repoType);
            window.location.href = page;
        };

        // ===== MY WORKSPACES =====
        async function loadMyWorkspaces() {
            try {
                const data = await API.get("/workspaces/my");
                renderWorkspaces(data.workspaces || []);
            } catch (err) {
                workspaceContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Yüklenemedi: ${err.message}</div>`;
            }
        }

        function renderWorkspaces(workspaces) {
            if (!workspaces.length) {
                workspaceContainer.innerHTML = `
                    <div style="text-align:center; padding:60px; color:var(--text-muted);">
                        <div style="font-size:3rem; opacity:0.3; margin-bottom:12px;">💼</div>
                        <h3>Henüz clone'ladığınız repo yok</h3>
                        <p>Katalogdan bir repository seçip clone edebilirsiniz.</p>
                    </div>`;
                return;
            }

            workspaceContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:12px;">
                ${workspaces.map(ws => {
                    const icon = TYPE_ICONS[ws.repository_type] || "📦";
                    const targetPage = getTargetPage(ws.repository_type);
                    const statusBadge = ws.has_changes
                        ? `<span class="badge" style="background:#fff3cd; color:#856404;">⚠️ Değişiklikler var</span>`
                        : `<span class="badge badge-success">✓ Sync'li</span>`;

                    return `
                    <div class="card" style="padding:20px;">
                        <div style="display:flex; align-items:center; gap:16px;">
                            <div style="font-size:2.5rem;">${icon}</div>
                            <div style="flex:1; min-width:0;">
                                <h3 style="margin:0 0 4px;">${escapeHtml(ws.repository_name)}</h3>
                                <div style="font-size:0.78rem; color:var(--text-muted); font-family:monospace;">Branch: ${escapeHtml(ws.branch_name)} • Tip: ${ws.repository_type || '-'}</div>
                                <div style="margin-top:8px;">${statusBadge}</div>
                            </div>
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <button class="btn btn-primary btn-sm" onclick="window.location.href='${targetPage}'">Aç</button>
                                <button class="btn btn-secondary btn-sm" onclick="pullWorkspace(${ws.id})">Pull</button>
                                ${ws.has_changes ? `<button class="btn btn-success btn-sm" onclick="pushWorkspace(${ws.id})">Push</button>` : ""}
                                <button class="btn btn-ghost btn-sm" onclick="showStatus(${ws.id})">Status</button>
                            </div>
                        </div>
                    </div>`;
                }).join("")}
            </div>`;
        }

        window.pullWorkspace = async function(wsId) {
            try {
                const data = await API.post(`/workspaces/${wsId}/pull`);
                if (data.has_conflicts) Toast.error("⚠️ Merge conflict!");
                else { Toast.success("Pull başarılı"); loadMyWorkspaces(); }
            } catch (err) { Toast.error(err.message); }
        };

        window.pushWorkspace = async function(wsId) {
            const msg = prompt("Commit mesajı:", "Update scenarios");
            if (!msg) return;
            try {
                await API.post(`/workspaces/${wsId}/commit`, { message: msg });
                await API.post(`/workspaces/${wsId}/push`);
                Toast.success("Push başarılı");
                loadMyWorkspaces();
            } catch (err) { Toast.error(err.message); }
        };

        window.showStatus = async function(wsId) {
            try {
                const data = await API.get(`/workspaces/${wsId}/status`);
                if (data.total_changes === 0) alert("✓ Değişiklik yok.");
                else alert(`⚠️ ${data.total_changes} dosya değişti:\n\n${data.changed_files.join("\n")}`);
            } catch (err) { Toast.error(err.message); }
        };

        function escapeHtml(t) { if (!t) return ""; const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

        // Init
        loadCatalog();
        loadMyWorkspaces();
    })();
    </script>
</body>
</html>
