<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Test Otomasyon Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-tertiary) 100%);
        }
        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .login-header {
            padding: 32px 32px 24px;
            text-align: center;
        }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.8rem;
            margin: 0 auto 16px;
        }
        .login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .login-subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .login-body { padding: 0 32px 32px; }
        .login-footer {
            padding: 20px 32px;
            background: var(--bg-tertiary);
            text-align: center;
        }
        .login-info {
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🧪</div>
                <h1 class="login-title">Test Otomasyon</h1>
                <p class="login-subtitle">Platformuna hoş geldiniz</p>
            </div>
            
            <div class="login-body">
                <form id="loginForm" onsubmit="login(event)">
                    <div class="form-group">
                        <label class="form-label">Kullanıcı Adı</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="kullaniciadi" required autofocus>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Şifre</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;">
                        Giriş Yap
                    </button>
                </form>
                <div class="login-info">
                    🔒 Hesap oluşturmak için sistem yöneticinize başvurun.
                </div>
            </div>
            
            <div class="login-footer">
                <button class="btn btn-ghost btn-sm" onclick="Theme.toggle()">🌙 Tema Değiştir</button>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        if (Auth.isLoggedIn()) {
            const existing = Auth.getUser();
            location.href = 'index.html';
        }

        async function login(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Giriş yapılıyor...';

            try {
                const data = await AuthAPI.login(
                    document.getElementById('loginUsername').value,
                    document.getElementById('loginPassword').value
                );
                Toast.success('Giriş başarılı!');
                const target = 'index.html';
                setTimeout(() => location.href = target, 500);
            } catch (err) {
                Toast.error(err.message);
                btn.disabled = false;
                btn.textContent = 'Giriş Yap';
            }
        }
    </script>
</body>
</html>
