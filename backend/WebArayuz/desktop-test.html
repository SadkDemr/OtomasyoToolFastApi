<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Test - Test Otomasyon Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .projects-view { padding: 24px; }
        .projects-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .projects-header h2 { font-size:1.3rem; display:flex; align-items:center; gap:10px; }
        .projects-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; }

        .project-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:12px; padding:20px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
        .project-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.08); border-color:var(--accent-primary); }
        .project-card .card-icon { font-size:2.5rem; margin-bottom:12px; }
        .project-card h3 { font-size:1rem; margin-bottom:6px; }
        .project-card .card-desc { font-size:0.85rem; color:var(--text-muted); margin-bottom:12px; line-height:1.4; }
        .project-card .card-meta { display:flex; gap:12px; font-size:0.75rem; color:var(--text-muted); }
        .project-card .card-badge { position:absolute; top:12px; right:12px; }

        .empty-projects { text-align:center; padding:80px 20px; color:var(--text-muted); }
        .empty-projects .icon { font-size:4rem; opacity:0.3; margin-bottom:16px; }

        /* Editor view - embedded advanced editor */
        .editor-view { display:none; height:calc(100vh - 60px); flex-direction:column; }
        .editor-view.active { display:flex; }
        .editor-topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border-color); background:var(--bg-secondary); flex-shrink:0; }
        .back-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; }
        .back-btn:hover { background:var(--bg-tertiary); }
        .project-name { font-weight:600; font-size:1rem; flex:1; }
        .git-actions { display:flex; gap:6px; }

        .editor-frame { flex:1; border:none; width:100%; }

        .btn { padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:0.85rem; font-weight:500; display:inline-flex; align-items:center; gap:6px; transition:all 0.15s; }
        .btn-sm { padding:5px 12px; font-size:0.78rem; }
        .btn-primary { background:var(--accent-primary); color:white; }
        .btn-secondary { background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-color); }
        .btn-ghost { background:transparent; color:var(--text-secondary); }
        .badge { padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:600; }
        .badge-success { background:rgba(16,185,129,0.15); color:var(--success); }
        .badge-warning { background:rgba(245,158,11,0.15); color:var(--warning); }
        .badge-info { background:rgba(59,130,246,0.15); color:var(--info); }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content" style="overflow:hidden;">
            <header class="header" style="flex-shrink:0;">
                <div class="header-left"><h1 class="page-title">🖥️ Desktop Test</h1></div>
                <div class="header-right"><button class="theme-toggle" onclick="Theme.toggle()">🌙</button></div>
            </header>

            <!-- VIEW 1: PROJECT LIST -->
            <div class="projects-view" id="projectsView">
                <div class="projects-header">
                    <h2>🖥️ Desktop Projeleri</h2>
                    <button class="btn btn-secondary btn-sm" onclick="loadProjects()">
                        <span class="material-icons-round" style="font-size:1rem;">refresh</span> Yenile
                    </button>
                </div>
                <div class="projects-grid" id="projectsGrid">
                    <div class="empty-projects"><div class="icon">🖥️</div><p>Yükleniyor...</p></div>
                </div>
            </div>

            <!-- VIEW 2: ADVANCED EDITOR (iframe or inline) -->
            <div class="editor-view" id="editorView">
                <div class="editor-topbar">
                    <button class="back-btn" onclick="backToProjects()"><span class="material-icons-round">arrow_back</span></button>
                    <span class="project-name" id="editorProjectName">Desktop Proje</span>
                    <span class="badge badge-success" id="gitStatusBadge">✓ Sync</span>
                    <div class="git-actions">
                        <button class="btn btn-secondary btn-sm" onclick="gitPull()">
                            <span class="material-icons-round" style="font-size:0.9rem;">cloud_download</span> Pull
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="gitCommitPush()">
                            <span class="material-icons-round" style="font-size:0.9rem;">cloud_upload</span> Push
                        </button>
                        <button class="btn btn-ghost btn-sm" onclick="gitStatus()">
                            <span class="material-icons-round" style="font-size:0.9rem;">info</span>
                        </button>
                    </div>
                </div>
                <!-- Advanced Editor iframe -->
                <iframe class="editor-frame" id="advancedEditorFrame" src=""></iframe>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
    (function() {
        "use strict";

        let currentWorkspace = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!Auth.checkAuth()) return;
            await loadProjects();
        });

        // ========== PROJECTS ==========
        window.loadProjects = async function() {
            const grid = document.getElementById("projectsGrid");
            grid.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Yükleniyor...</div>';

            try {
                const [myData, catalogData] = await Promise.all([
                    API.get("/workspaces/my"),
                    API.get("/workspaces/catalog")
                ]);

                const myWs = (myData.workspaces || []).filter(w =>
                    ["desktop", "web-desktop"].includes(w.repository_type)
                );
                const catalog = (catalogData.catalog || []).filter(r =>
                    ["desktop", "web-desktop"].includes(r.repo_type) && !r.is_cloned_by_me
                );

                if (!myWs.length && !catalog.length) {
                    grid.innerHTML = `
                        <div class="empty-projects" style="grid-column:1/-1;">
                            <div class="icon">🖥️</div>
                            <h3>Henüz desktop projesi yok</h3>
                            <p style="font-size:0.9rem;">Admin panelinden desktop tipi repository eklendiğinde burada görünecek.</p>
                        </div>`;
                    return;
                }

                let html = "";

                myWs.forEach(ws => {
                    const typeLabel = ws.repository_type === "web-desktop" ? "🌐🖥️ Web+Desktop" : "🖥️ Desktop";
                    html += `
                    <div class="project-card" onclick="openProject(${ws.id})">
                        <div class="card-badge">
                            <span class="badge ${ws.has_changes ? 'badge-warning' : 'badge-success'}">${ws.has_changes ? '⚠️ Değişiklik' : '✓ Sync'}</span>
                        </div>
                        <div class="card-icon">🖥️</div>
                        <h3>${escapeHtml(ws.repository_name)}</h3>
                        <div class="card-desc">${typeLabel} • Branch: ${escapeHtml(ws.branch_name)}</div>
                        <div class="card-meta">
                            <span>📂 Aktif workspace</span>
                            <span>🎯 Advanced Editor</span>
                        </div>
                    </div>`;
                });

                catalog.forEach(r => {
                    html += `
                    <div class="project-card" onclick="cloneAndOpen(${r.id})" style="border-style:dashed;">
                        <div class="card-badge"><span class="badge badge-info">Clone Et</span></div>
                        <div class="card-icon" style="opacity:0.5;">🖥️</div>
                        <h3>${escapeHtml(r.name)}</h3>
                        <div class="card-desc">${escapeHtml(r.description || r.repo_url)}</div>
                    </div>`;
                });

                grid.innerHTML = html;
            } catch (e) {
                grid.innerHTML = `<div class="empty-projects" style="grid-column:1/-1;"><p>Hata: ${e.message}</p></div>`;
            }
        };

        window.cloneAndOpen = async function(repoId) {
            if (!confirm("Clone edilecek. Devam?")) return;
            try {
                Toast.info("Clone başlatıldı...");
                const res = await API.post("/workspaces/clone", { repository_id: repoId });
                Toast.success("Clone başarılı!");
                if (res.workspace_id) openProject(res.workspace_id);
                else loadProjects();
            } catch (e) { Toast.error("Clone hatası: " + e.message); }
        };

        // ========== OPEN PROJECT ==========
        window.openProject = async function(wsId) {
            try {
                currentWorkspace = await API.get(`/workspaces/${wsId}`);

                document.getElementById("projectsView").style.display = "none";
                document.getElementById("editorView").classList.add("active");
                document.getElementById("editorProjectName").textContent = currentWorkspace.repository_name || "Desktop Proje";

                // Advanced Editor'ü iframe ile yükle
                document.getElementById("advancedEditorFrame").src = `advanced_editor.html?workspace=${wsId}`;

            } catch (e) { Toast.error("Açılamadı: " + e.message); }
        };

        window.backToProjects = function() {
            currentWorkspace = null;
            document.getElementById("advancedEditorFrame").src = "";
            document.getElementById("editorView").classList.remove("active");
            document.getElementById("projectsView").style.display = "block";
            loadProjects();
        };

        // ========== GIT ==========
        window.gitPull = async function() {
            if (!currentWorkspace) return;
            try {
                await API.post(`/workspaces/${currentWorkspace.id}/pull`);
                Toast.success("Pull başarılı");
                // Advanced editor'ı yenile
                document.getElementById("advancedEditorFrame").contentWindow.location.reload();
            } catch (e) { Toast.error(e.message); }
        };

        window.gitCommitPush = async function() {
            if (!currentWorkspace) return;
            const msg = prompt("Commit mesajı:", "Update desktop scenarios");
            if (!msg) return;
            try {
                await API.post(`/workspaces/${currentWorkspace.id}/commit`, { message: msg });
                await API.post(`/workspaces/${currentWorkspace.id}/push`);
                Toast.success("Commit & Push başarılı");
            } catch (e) { Toast.error(e.message); }
        };

        window.gitStatus = async function() {
            if (!currentWorkspace) return;
            try {
                const data = await API.get(`/workspaces/${currentWorkspace.id}/status`);
                if (data.total_changes === 0) alert("✓ Değişiklik yok.");
                else alert(`⚠️ ${data.total_changes} dosya değişti:\n\n${data.changed_files.join('\n')}`);
            } catch (e) { Toast.error(e.message); }
        };

        function escapeHtml(t) { if (!t) return ""; const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
        window.escapeHtml = escapeHtml;
    })();
    </script>
</body>
</html>
