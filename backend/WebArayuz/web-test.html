<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Test - Test Otomasyon Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== PROJECT LIST VIEW ===== */
        .projects-view { padding: 24px; }
        .projects-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .projects-header h2 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        
        .project-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; cursor: pointer;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .project-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-color: var(--accent-primary); }
        .project-card .card-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .project-card h3 { font-size: 1rem; margin-bottom: 6px; }
        .project-card .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .project-card .card-meta { display: flex; gap: 12px; font-size: 0.75rem; color: var(--text-muted); }
        .project-card .card-badge { position: absolute; top: 12px; right: 12px; }
        
        .empty-projects { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-projects .icon { font-size: 4rem; opacity: 0.3; margin-bottom: 16px; }

        /* ===== EDITOR VIEW (Hidden by default) ===== */
        .editor-view { display: none; height: calc(100vh - 60px); }
        .editor-view.active { display: flex; flex-direction: column; }

        /* Top bar */
        .editor-topbar {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary); flex-shrink: 0;
        }
        .editor-topbar .back-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; }
        .editor-topbar .back-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .editor-topbar .project-name { font-weight: 600; font-size: 1rem; flex: 1; }
        .editor-topbar .git-actions { display: flex; gap: 6px; }

        /* Main editor grid */
        .editor-grid { display: grid; grid-template-columns: 240px 1fr 400px; flex: 1; overflow: hidden; }

        /* File tree panel */
        .file-panel { background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .file-panel-header { padding: 10px 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); background: var(--bg-tertiary); }
        .file-tree { flex: 1; overflow-y: auto; padding: 6px; }
        .file-item { padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.83rem; display: flex; align-items: center; gap: 8px; color: var(--text-primary); transition: all 0.15s; }
        .file-item:hover { background: var(--bg-tertiary); }
        .file-item.active { background: rgba(59,130,246,0.12); color: var(--accent-primary); font-weight: 600; }
        .file-item .file-icon { font-size: 0.9rem; }

        /* Code editor panel */
        .code-panel { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); }
        .code-header { padding: 8px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; background: var(--bg-secondary); font-size: 0.85rem; }
        .code-header .file-tab { padding: 6px 14px; border-radius: 6px; background: var(--bg-primary); font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .code-toolbar { padding: 6px 16px; border-bottom: 1px solid var(--border-color); display: flex; gap: 6px; align-items: center; background: var(--bg-secondary); flex-wrap: wrap; }
        .tool-chip { display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.75rem; cursor: pointer; color: var(--text-primary); transition: all 0.15s; }
        .tool-chip:hover { border-color: var(--accent-primary); background: rgba(79,70,229,0.08); }
        .code-editor { flex: 1; padding: 16px; border: none; outline: none; resize: none; background: var(--bg-primary); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; line-height: 1.7; }
        .code-footer { padding: 8px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; background: var(--bg-secondary); }

        /* Log/Result panel */
        .log-panel { background: var(--bg-secondary); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .log-panel-header { padding: 10px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--bg-tertiary); }
        .log-tabs { display: flex; gap: 4px; padding: 6px 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .log-tab { flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; text-align: center; }
        .log-tab.active { background: var(--bg-tertiary); color: var(--text-primary); font-weight: 600; }
        .log-body { flex: 1; overflow-y: auto; padding: 12px; }
        .log-tab-content { display: none; height: 100%; overflow-y: auto; padding: 12px; }
        .log-tab-content.active { display: block; }

        /* Log steps */
        .log-step { padding: 12px; border-radius: 8px; margin-bottom: 10px; background: var(--bg-tertiary); border-left: 4px solid var(--border-color); }
        .log-step.waiting { border-left-color: var(--text-muted); opacity: 0.5; }
        .log-step.running { border-left-color: var(--warning); background: rgba(245,158,11,0.08); animation: pulse 1.2s infinite; }
        .log-step.success { border-left-color: var(--success); background: rgba(16,185,129,0.06); }
        .log-step.failed { border-left-color: var(--danger); background: rgba(239,68,68,0.06); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .log-step-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .log-step-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; background: var(--bg-secondary); flex-shrink: 0; }
        .log-step.success .log-step-num { background: var(--success); color: white; }
        .log-step.failed .log-step-num { background: var(--danger); color: white; }
        .log-step.running .log-step-num { background: var(--warning); color: white; }
        .log-step-action { font-size: 0.83rem; font-weight: 500; flex: 1; }
        .log-step-msg { font-size: 0.75rem; color: var(--text-muted); }
        .log-step-screenshot { margin-top: 8px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
        .log-step-screenshot img { width: 100%; cursor: pointer; display: block; }

        /* Settings panel content */
        .settings-form { padding: 16px; }
        .settings-form .form-group { margin-bottom: 14px; }
        .settings-form .form-label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
        .settings-form .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-primary); color: var(--text-primary); font-size: 0.85rem; box-sizing: border-box; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
        .toggle-switch { position: relative; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--bg-tertiary); border-radius: 22px; border: 1px solid var(--border-color); transition: 0.3s; }
        .toggle-slider:before { content:""; position: absolute; height: 16px; width: 16px; left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent-primary); border-color: var(--accent-primary); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

        /* History entries */
        .history-entry { background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); overflow: hidden; }
        .history-header { padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .history-header:hover { background: var(--bg-hover); }
        .history-body { display: none; padding: 12px; border-top: 1px solid var(--border-color); font-size: 0.8rem; }
        .history-entry.open .history-body { display: block; }

        /* Progress */
        .progress-bar { height: 4px; background: var(--bg-tertiary); border-radius: 2px; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: var(--accent-primary); transition: width 0.3s; border-radius: 2px; }

        /* Badges */
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
        .badge-success { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,0.15); color: var(--info); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-synced { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-changes { background: rgba(245,158,11,0.15); color: var(--warning); }

        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-sm { padding: 5px 12px; font-size: 0.78rem; }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-ghost { background: transparent; color: var(--text-secondary); }
        .btn-ghost:hover { background: var(--bg-tertiary); }
        .icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; }
        .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

        .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Screenshot Modal */
        .screenshot-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .screenshot-modal.active { display: flex; }
        .screenshot-modal img { max-width: 95%; max-height: 95%; border-radius: 8px; }
        .screenshot-modal .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content" style="overflow:hidden;">
            <header class="header" style="flex-shrink:0;">
                <div class="header-left"><h1 class="page-title">🌐 Web Test</h1></div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="Theme.toggle()">🌙</button>
                </div>
            </header>

            <!-- ===== VIEW 1: PROJECT LIST ===== -->
            <div class="projects-view" id="projectsView">
                <div class="projects-header">
                    <h2>🌐 Web Projeleri</h2>
                    <button class="btn btn-secondary btn-sm" onclick="loadProjects()">
                        <span class="material-icons-round" style="font-size:1rem;">refresh</span> Yenile
                    </button>
                </div>
                <div class="projects-grid" id="projectsGrid">
                    <div class="empty-projects">
                        <div class="icon">🌐</div>
                        <p>Yükleniyor...</p>
                    </div>
                </div>
            </div>

            <!-- ===== VIEW 2: EDITOR + RUNNER ===== -->
            <div class="editor-view" id="editorView">
                <!-- Top Bar -->
                <div class="editor-topbar">
                    <button class="back-btn" onclick="backToProjects()" title="Projelere Dön">
                        <span class="material-icons-round">arrow_back</span>
                    </button>
                    <span class="project-name" id="editorProjectName">Proje Adı</span>
                    <span class="badge badge-synced" id="gitStatusBadge">✓ Sync</span>

                    <div class="git-actions">
                        <button class="btn btn-secondary btn-sm" onclick="gitPull()" title="Pull">
                            <span class="material-icons-round" style="font-size:0.9rem;">cloud_download</span> Pull
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="gitCommitPush()" title="Commit & Push">
                            <span class="material-icons-round" style="font-size:0.9rem;">cloud_upload</span> Push
                        </button>
                        <button class="btn btn-ghost btn-sm" onclick="gitStatus()" title="Status">
                            <span class="material-icons-round" style="font-size:0.9rem;">info</span>
                        </button>
                    </div>
                </div>

                <!-- Editor Grid -->
                <div class="editor-grid">
                    <!-- LEFT: File Tree -->
                    <div class="file-panel">
                        <div class="file-panel-header">
                            <span>📁 Dosyalar</span>
                            <div style="display:flex; gap:4px;">
                                <button class="icon-btn" onclick="createNewFile()" title="Yeni Dosya">
                                    <span class="material-icons-round" style="font-size:1rem;">note_add</span>
                                </button>
                                <button class="icon-btn" onclick="loadFileTree()" title="Yenile">
                                    <span class="material-icons-round" style="font-size:1rem;">refresh</span>
                                </button>
                            </div>
                        </div>
                        <div class="file-tree" id="fileTree">
                            <div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">Dosyalar yükleniyor...</div>
                        </div>
                    </div>

                    <!-- CENTER: Code Editor -->
                    <div class="code-panel">
                        <div class="code-header">
                            <div class="file-tab" id="currentFileTab">
                                <span class="material-icons-round" style="font-size:0.9rem;">description</span>
                                <span id="currentFileName">Dosya seçin</span>
                            </div>
                            <div style="margin-left:auto; display:flex; gap:6px; align-items:center;">
                                <select id="langSelect" class="form-input" style="width:auto; padding:4px 8px; font-size:0.78rem;" onchange="changeLang()">
                                    <option value="tr">🇹🇷 Türkçe</option>
                                    <option value="en">🇬🇧 English</option>
                                </select>
                                <button class="btn btn-sm btn-secondary" onclick="saveCurrentFile()">
                                    <span class="material-icons-round" style="font-size:0.9rem;">save</span> Kaydet
                                </button>
                            </div>
                        </div>
                        <div class="code-toolbar" id="actionToolbar">
                            <span style="font-size:0.72rem; color:var(--text-muted); font-weight:600;">Aksiyonlar:</span>
                            <!-- Actions will be populated dynamically -->
                        </div>
                        <textarea class="code-editor" id="codeEditor" placeholder="Dosya seçin veya yeni dosya oluşturun..."></textarea>
                        <div class="code-footer">
                            <button class="btn btn-success btn-sm" id="btnRun" onclick="runTest()">
                                <span class="material-icons-round" style="font-size:0.9rem;">play_arrow</span> Çalıştır
                            </button>
                            <button class="btn btn-danger btn-sm" id="btnStop" onclick="stopTest()" style="display:none;">
                                <span class="spinner"></span> Çalışıyor...
                            </button>
                            <button class="btn btn-secondary btn-sm" id="btnPdf" onclick="downloadPdf()" style="display:none;">
                                <span class="material-icons-round" style="font-size:0.9rem;">picture_as_pdf</span> PDF
                            </button>
                            <span style="margin-left:auto; font-size:0.75rem; color:var(--text-muted);" id="autoSaveStatus"></span>
                        </div>
                    </div>

                    <!-- RIGHT: Logs / Settings / History -->
                    <div class="log-panel">
                        <div class="log-tabs">
                            <button class="log-tab active" data-tab="log" onclick="switchLogTab('log')">📊 Canlı Log</button>
                            <button class="log-tab" data-tab="settings" onclick="switchLogTab('settings')">⚙️ Ayarlar</button>
                            <button class="log-tab" data-tab="history" onclick="switchLogTab('history')">📜 Geçmiş</button>
                        </div>

                        <!-- Log Tab -->
                        <div class="log-tab-content active" id="logTabContent">
                            <div style="display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border-color); margin-bottom:10px;">
                                <span id="statusIcon" style="font-size:1.2rem;">⏸️</span>
                                <span id="statusTitle" style="font-weight:600; font-size:0.9rem;">Hazır</span>
                                <span id="runDuration" style="margin-left:auto; font-size:0.75rem; color:var(--text-muted);"></span>
                                <span class="badge badge-info" id="statusBadge">Bekliyor</span>
                            </div>
                            <div id="logContainer">
                                <div style="text-align:center; padding:40px; color:var(--text-muted);">
                                    <div style="font-size:2.5rem; opacity:0.2; margin-bottom:8px;">📋</div>
                                    <div style="font-size:0.85rem;">Test çalıştırıldığında loglar burada görünecek</div>
                                </div>
                            </div>
                        </div>

                        <!-- Settings Tab -->
                        <div class="log-tab-content" id="settingsTabContent">
                            <div class="settings-form">
                                <div class="form-group">
                                    <label class="form-label">Başlangıç URL</label>
                                    <input type="text" id="startUrl" class="form-input" placeholder="https://example.com">
                                </div>
                                <div class="toggle-row">
                                    <span style="font-size:0.85rem;">Headless (Arkaplanda)</span>
                                    <label class="toggle-switch"><input type="checkbox" id="headlessMode" checked><span class="toggle-slider"></span></label>
                                </div>
                                <div class="toggle-row">
                                    <span style="font-size:0.85rem;">Hata durumunda dur</span>
                                    <label class="toggle-switch"><input type="checkbox" id="stopOnFail" checked><span class="toggle-slider"></span></label>
                                </div>
                                <div class="toggle-row">
                                    <span style="font-size:0.85rem;">Her adımda screenshot</span>
                                    <label class="toggle-switch"><input type="checkbox" id="takeScreenshots" checked><span class="toggle-slider"></span></label>
                                </div>
                            </div>
                        </div>

                        <!-- History Tab -->
                        <div class="log-tab-content" id="historyTabContent">
                            <div id="historyContainer">
                                <div style="text-align:center; padding:40px; color:var(--text-muted);">
                                    <div style="font-size:2.5rem; opacity:0.2; margin-bottom:8px;">📜</div>
                                    <div style="font-size:0.85rem;">Koşum geçmişi burada görünecek</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Screenshot Modal -->
    <div class="screenshot-modal" id="screenshotModal" onclick="closeScreenshot()">
        <button class="close-btn">&times;</button>
        <img id="screenshotImg" src="">
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
    (function() {
        "use strict";

        // ========== STATE ==========
        let currentWorkspace = null;  // { id, repository_name, branch_name, repository_type, ... }
        let currentFile = null;       // current open file path
        let allActions = [];          // action mapper actions
        let ws = null;                // WebSocket for live test
        let isRunning = false;
        let autoSaveTimer = null;
        let pdfUrl = null;
        let startTime = 0;
        let totalSteps = 0;
        const PROJECT_TYPE = "web";   // Bu sayfa sadece web projeleri

        // ========== INIT ==========
        document.addEventListener("DOMContentLoaded", async () => {
            if (!Auth.checkAuth()) return;
            await loadProjects();
        });

        // ========== PROJECT LIST ==========
        window.loadProjects = async function() {
            const grid = document.getElementById("projectsGrid");
            grid.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Yükleniyor...</div>';

            try {
                // Kullanıcının workspace'leri + katalog
                const [myData, catalogData] = await Promise.all([
                    API.get("/workspaces/my"),
                    API.get("/workspaces/catalog")
                ]);

                const myWorkspaces = (myData.workspaces || []).filter(ws =>
                    ws.repository_type === "web" || ws.repository_type === "web-selenium"
                );
                const catalog = (catalogData.catalog || []).filter(r =>
                    (r.repo_type === "web" || r.repo_type === "web-selenium") && !r.is_cloned_by_me
                );

                if (myWorkspaces.length === 0 && catalog.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-projects" style="grid-column:1/-1;">
                            <div class="icon">🌐</div>
                            <h3>Henüz web projesi yok</h3>
                            <p style="font-size:0.9rem;">Admin panelinden web tipi repository eklendiğinde burada görünecek.</p>
                        </div>`;
                    return;
                }

                let html = "";

                // Benim workspace'lerim
                myWorkspaces.forEach(ws => {
                    html += `
                    <div class="project-card" onclick="openProject(${ws.id})">
                        <div class="card-badge">
                            <span class="badge ${ws.has_changes ? 'badge-changes' : 'badge-synced'}">${ws.has_changes ? '⚠️ Değişiklik' : '✓ Sync'}</span>
                        </div>
                        <div class="card-icon">🌐</div>
                        <h3>${escapeHtml(ws.repository_name)}</h3>
                        <div class="card-desc">Branch: ${escapeHtml(ws.branch_name)}</div>
                        <div class="card-meta">
                            <span>📂 Workspace aktif</span>
                            <span>🔀 ${escapeHtml(ws.branch_name)}</span>
                        </div>
                    </div>`;
                });

                // Katalogdan clone edilmemiş repolar
                catalog.forEach(r => {
                    html += `
                    <div class="project-card" onclick="cloneAndOpen(${r.id})" style="border-style:dashed;">
                        <div class="card-badge"><span class="badge badge-info">Clone Et</span></div>
                        <div class="card-icon" style="opacity:0.5;">🌐</div>
                        <h3>${escapeHtml(r.name)}</h3>
                        <div class="card-desc">${escapeHtml(r.description || r.repo_url)}</div>
                        <div class="card-meta">
                            <span>📦 Henüz clone edilmedi</span>
                        </div>
                    </div>`;
                });

                grid.innerHTML = html;
            } catch (e) {
                grid.innerHTML = `<div class="empty-projects" style="grid-column:1/-1;"><p>Yükleme hatası: ${e.message}</p></div>`;
            }
        };

        window.cloneAndOpen = async function(repoId) {
            if (!confirm("Bu repository clone'lanacak. Devam?")) return;
            try {
                Toast.info("Clone işlemi başlatıldı...");
                const res = await API.post("/workspaces/clone", { repository_id: repoId });
                Toast.success("Clone başarılı!");
                await loadProjects();
                // Yeni workspace'i bul ve aç
                if (res.workspace_id) {
                    openProject(res.workspace_id);
                }
            } catch (e) {
                Toast.error("Clone hatası: " + e.message);
            }
        };

        // ========== OPEN PROJECT (Switch to editor view) ==========
        window.openProject = async function(workspaceId) {
            try {
                // Workspace detayını al
                const wsData = await API.get(`/workspaces/${workspaceId}`);
                currentWorkspace = wsData;

                // UI geçişi
                document.getElementById("projectsView").style.display = "none";
                document.getElementById("editorView").classList.add("active");
                document.getElementById("editorProjectName").textContent = wsData.repository_name || "Proje";

                // Dosya ağacını yükle
                await loadFileTree();

                // Action mapper'ı yükle
                await loadActions();

                // Geçmişi yükle
                loadHistory();

                // Git status güncelle
                updateGitStatus();

            } catch (e) {
                Toast.error("Proje açılamadı: " + e.message);
            }
        };

        window.backToProjects = function() {
            // Temizle
            if (ws) ws.close();
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            currentWorkspace = null;
            currentFile = null;

            document.getElementById("editorView").classList.remove("active");
            document.getElementById("projectsView").style.display = "block";
            loadProjects();
        };

        // ========== FILE TREE ==========
        window.loadFileTree = async function() {
            if (!currentWorkspace) return;
            const tree = document.getElementById("fileTree");

            try {
                const data = await API.get(`/workspaces/${currentWorkspace.id}/files`);
                const files = data.files || [];

                if (files.length === 0) {
                    tree.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">Dosya yok</div>';
                    return;
                }

                tree.innerHTML = files.map(f => {
                    const ext = f.split(".").pop().toLowerCase();
                    const icon = ext === "py" ? "🐍" : ext === "json" ? "📋" : ext === "txt" ? "📝" : "📄";
                    const isActive = currentFile === f;
                    return `<div class="file-item ${isActive ? 'active' : ''}" onclick="openFile('${escapeHtml(f)}')" title="${f}">
                        <span class="file-icon">${icon}</span>
                        <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f}</span>
                    </div>`;
                }).join("");
            } catch (e) {
                tree.innerHTML = `<div style="padding:20px; color:var(--text-muted);">Hata: ${e.message}</div>`;
            }
        };

        window.openFile = async function(filePath) {
            if (!currentWorkspace) return;
            try {
                const data = await API.post(`/workspaces/${currentWorkspace.id}/files/read`, { file_path: filePath });
                currentFile = filePath;
                document.getElementById("codeEditor").value = data.content || "";
                document.getElementById("currentFileName").textContent = filePath;
                loadFileTree(); // Refresh active state
                setupAutoSave();
            } catch (e) {
                Toast.error("Dosya okunamadı: " + e.message);
            }
        };

        window.saveCurrentFile = async function() {
            if (!currentWorkspace || !currentFile) return;
            try {
                await API.post(`/workspaces/${currentWorkspace.id}/files/write`, {
                    file_path: currentFile,
                    content: document.getElementById("codeEditor").value
                });
                document.getElementById("autoSaveStatus").textContent = "✓ Kaydedildi " + new Date().toLocaleTimeString("tr-TR");
                updateGitStatus();
            } catch (e) {
                Toast.error("Kaydetme hatası: " + e.message);
            }
        };

        window.createNewFile = async function() {
            const name = prompt("Dosya adı (örn: test_login.py):");
            if (!name) return;
            try {
                await API.post(`/workspaces/${currentWorkspace.id}/files/write`, {
                    file_path: name,
                    content: "# " + name + "\n\n"
                });
                await loadFileTree();
                openFile(name);
                Toast.success("Dosya oluşturuldu");
            } catch (e) {
                Toast.error(e.message);
            }
        };

        function setupAutoSave() {
            const editor = document.getElementById("codeEditor");
            editor.oninput = () => {
                if (autoSaveTimer) clearTimeout(autoSaveTimer);
                document.getElementById("autoSaveStatus").textContent = "Kaydedilmedi...";
                autoSaveTimer = setTimeout(() => saveCurrentFile(), 3000);
            };
        }

        // ========== ACTION MAPPER ==========
        async function loadActions() {
            try {
                const lang = document.getElementById("langSelect").value;
                const data = await API.get(`/workspaces/actions?lang=${lang}&type=web`);
                allActions = data.actions || [];
                renderActionToolbar();
            } catch (e) {
                console.warn("Actions yüklenemedi:", e);
            }
        }

        function renderActionToolbar() {
            const bar = document.getElementById("actionToolbar");
            const iconMap = { navigate: "language", click: "touch_app", sendKeys: "keyboard", wait: "timer", assert: "visibility", screenshot: "camera_alt", scroll: "swap_vert", select: "list", hover: "pan_tool" };

            bar.innerHTML = '<span style="font-size:0.72rem; color:var(--text-muted); font-weight:600;">Aksiyonlar:</span>' +
                allActions.map(a => `
                    <div class="tool-chip" onclick="insertAction('${a.action}')" title="${a.description || a.action}">
                        <span class="material-icons-round" style="font-size:0.85rem;">${iconMap[a.action] || 'code'}</span>
                        ${a.display_name || a.action}
                    </div>
                `).join("");
        }

        window.insertAction = function(actionName) {
            const action = allActions.find(a => a.action === actionName);
            if (!action) return;
            const editor = document.getElementById("codeEditor");
            const template = action.template || action.display_name || actionName;
            const pos = editor.selectionStart;
            editor.value = editor.value.substring(0, pos) + template + "\n" + editor.value.substring(editor.selectionEnd);
            editor.focus();
            editor.selectionStart = editor.selectionEnd = pos + template.length + 1;
        };

        window.changeLang = function() { loadActions(); };

        // ========== GIT OPERATIONS ==========
        window.gitPull = async function() {
            if (!currentWorkspace) return;
            try {
                const data = await API.post(`/workspaces/${currentWorkspace.id}/pull`);
                if (data.has_conflicts) {
                    Toast.error("⚠️ Merge conflict! Manuel çözüm gerekli.");
                } else {
                    Toast.success("✓ Pull başarılı");
                    loadFileTree();
                    if (currentFile) openFile(currentFile);
                }
                updateGitStatus();
            } catch (e) { Toast.error("Pull hatası: " + e.message); }
        };

        window.gitCommitPush = async function() {
            if (!currentWorkspace) return;
            const msg = prompt("Commit mesajı:", "Update web test scenarios");
            if (!msg) return;
            try {
                await API.post(`/workspaces/${currentWorkspace.id}/commit`, { message: msg });
                await API.post(`/workspaces/${currentWorkspace.id}/push`);
                Toast.success("✓ Commit & Push başarılı");
                updateGitStatus();
            } catch (e) { Toast.error("Push hatası: " + e.message); }
        };

        window.gitStatus = async function() {
            if (!currentWorkspace) return;
            try {
                const data = await API.get(`/workspaces/${currentWorkspace.id}/status`);
                if (data.total_changes === 0) {
                    alert("✓ Değişiklik yok, her şey sync'li.");
                } else {
                    alert(`⚠️ ${data.total_changes} dosya değişti:\n\n${data.changed_files.join('\n')}`);
                }
            } catch (e) { Toast.error(e.message); }
        };

        async function updateGitStatus() {
            if (!currentWorkspace) return;
            try {
                const data = await API.get(`/workspaces/${currentWorkspace.id}/status`);
                const badge = document.getElementById("gitStatusBadge");
                if (data.total_changes > 0) {
                    badge.textContent = `⚠️ ${data.total_changes} değişiklik`;
                    badge.className = "badge badge-changes";
                } else {
                    badge.textContent = "✓ Sync";
                    badge.className = "badge badge-synced";
                }
            } catch (e) { /* silent */ }
        }

        // ========== TEST RUNNER ==========
        window.runTest = async function() {
            const steps = document.getElementById("codeEditor").value.trim();
            if (!steps) { Toast.error("Test adımları boş"); return; }
            if (!currentFile) { Toast.error("Önce dosya seçin"); return; }

            // Kaydet
            await saveCurrentFile();

            isRunning = true;
            pdfUrl = null;
            startTime = Date.now();
            document.getElementById("btnRun").style.display = "none";
            document.getElementById("btnStop").style.display = "inline-flex";
            document.getElementById("btnPdf").style.display = "none";
            document.getElementById("statusBadge").textContent = "Başlatılıyor...";
            document.getElementById("statusBadge").className = "badge badge-warning";
            switchLogTab("log");

            // Adımları hazırla
            const lines = steps.split("\n").filter(l => l.trim() && !l.trim().startsWith("#"));
            totalSteps = lines.length;

            document.getElementById("logContainer").innerHTML =
                '<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>' +
                lines.map((line, i) => `
                    <div class="log-step waiting" id="step-${i+1}">
                        <div class="log-step-header">
                            <div class="log-step-num">${i+1}</div>
                            <div class="log-step-action">${escapeHtml(line.replace(/^\d+[\.\)\-]\s*/, ''))}</div>
                        </div>
                        <div class="log-step-msg">Bekliyor...</div>
                    </div>
                `).join("");

            try {
                const scenarioName = currentFile.replace(/\.[^.]+$/, "") || "Web Test";
                const res = await API.post("/web/start-test", {
                    url: document.getElementById("startUrl").value,
                    natural_text: steps,
                    headless: document.getElementById("headlessMode").checked,
                    stop_on_fail: document.getElementById("stopOnFail").checked,
                    scenario_name: scenarioName,
                    workspace_id: currentWorkspace?.id
                });
                connectTestWebSocket(res.test_id);
            } catch (e) {
                testFinished(false, e.message);
            }
        };

        function connectTestWebSocket(testId) {
            const protocol = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${location.host}/api/web/ws/${testId}`);

            ws.onopen = () => {
                document.getElementById("statusBadge").textContent = "Çalışıyor...";
                document.getElementById("statusBadge").className = "badge badge-warning";
                setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 5000);
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === "step") updateStep(data);
                    else if (data.type === "complete") testFinished(data.success, data.message, data.pdf_url, data.detailed_results);
                    else if (data.type === "error") testFinished(false, data.message);
                } catch (err) { console.error("[WS] Parse:", err); }
            };

            ws.onclose = () => { console.log("[WS] Kapandı"); };
        }

        function updateStep(data) {
            const el = document.getElementById(`step-${data.step}`);
            if (!el) return;

            el.className = `log-step ${data.status}`;
            const msg = el.querySelector(".log-step-msg");
            if (msg) msg.textContent = data.status === "running" ? "Çalışıyor..." : (data.message || data.status);

            if (data.screenshot && data.status !== "running" && !el.querySelector(".log-step-screenshot")) {
                el.innerHTML += `<div class="log-step-screenshot"><img src="data:image/png;base64,${data.screenshot}" onclick="openScreenshot(this.src)"></div>`;
            }

            if (data.status !== "running") {
                const done = document.querySelectorAll(".log-step.success, .log-step.failed").length;
                document.getElementById("progress").style.width = Math.round((done / totalSteps) * 100) + "%";
            }

            document.getElementById("runDuration").textContent = ((Date.now() - startTime) / 1000).toFixed(1) + "s";
            document.getElementById("logContainer").scrollTop = document.getElementById("logContainer").scrollHeight;
        }

        function testFinished(success, message, pdf, detailedResults) {
            isRunning = false;
            if (ws) ws.close();

            document.getElementById("btnRun").style.display = "inline-flex";
            document.getElementById("btnStop").style.display = "none";
            document.getElementById("runDuration").textContent = ((Date.now() - startTime) / 1000).toFixed(1) + "s";
            document.getElementById("progress").style.width = "100%";

            if (success) {
                document.getElementById("statusBadge").textContent = "✓ Başarılı";
                document.getElementById("statusBadge").className = "badge badge-success";
                document.getElementById("statusIcon").textContent = "✅";
                document.getElementById("statusTitle").textContent = "Başarılı";
                Toast.success("Test başarılı!");
            } else {
                document.getElementById("statusBadge").textContent = "✗ Başarısız";
                document.getElementById("statusBadge").className = "badge badge-danger";
                document.getElementById("statusIcon").textContent = "❌";
                document.getElementById("statusTitle").textContent = "Başarısız";
                Toast.error(message || "Test başarısız");
            }

            if (pdf) {
                pdfUrl = pdf;
                document.getElementById("btnPdf").style.display = "inline-flex";
            }

            // Kalan sonuçları güncelle
            if (detailedResults) {
                detailedResults.forEach(r => {
                    const el = document.getElementById(`step-${r.step_number}`);
                    if (el && !el.classList.contains("success") && !el.classList.contains("failed")) {
                        el.className = `log-step ${r.success ? 'success' : 'failed'}`;
                        el.querySelector(".log-step-msg").textContent = r.message || "";
                        if (r.screenshot && !el.querySelector(".log-step-screenshot")) {
                            el.innerHTML += `<div class="log-step-screenshot"><img src="data:image/png;base64,${r.screenshot}" onclick="openScreenshot(this.src)"></div>`;
                        }
                    }
                });
            }

            // Geçmişi güncelle
            loadHistory();
        }

        window.stopTest = function() {
            if (ws) ws.close();
            testFinished(false, "Kullanıcı tarafından durduruldu");
        };

        window.downloadPdf = function() {
            if (pdfUrl) window.open(pdfUrl, "_blank");
        };

        // ========== HISTORY ==========
        async function loadHistory() {
            const container = document.getElementById("historyContainer");
            if (!currentWorkspace) return;

            try {
                const data = await API.get(`/web/history?workspace_id=${currentWorkspace.id}`);
                const history = data.history || data || [];

                if (!history.length) {
                    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);"><div style="font-size:2rem; opacity:0.2; margin-bottom:8px;">📜</div><div>Henüz koşum geçmişi yok</div></div>';
                    return;
                }

                container.innerHTML = history.map(h => `
                    <div class="history-entry" onclick="this.classList.toggle('open')">
                        <div class="history-header">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="badge ${h.success ? 'badge-success' : 'badge-danger'}">${h.success ? '✓ Başarılı' : '✗ Başarısız'}</span>
                                <span style="font-size:0.78rem; color:var(--text-muted);">${h.scenario_name || 'Test'}</span>
                            </div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">
                                ${formatDate(h.created_at || h.start_time)}
                                ${h.duration ? ' • ' + h.duration + 's' : ''}
                            </div>
                        </div>
                        <div class="history-body">
                            <div style="font-size:0.8rem; color:var(--text-secondary);">
                                ${h.total_steps ? `Adımlar: ${h.passed || 0}/${h.total_steps} başarılı` : ''}
                                ${h.message ? `<br>Mesaj: ${escapeHtml(h.message)}` : ''}
                                ${h.pdf_url ? `<br><a href="${h.pdf_url}" target="_blank" style="color:var(--accent-primary);">📄 PDF Raporu</a>` : ''}
                            </div>
                        </div>
                    </div>
                `).join("");
            } catch (e) {
                console.warn("History yüklenemedi:", e);
            }
        }

        // ========== LOG TAB SWITCH ==========
        window.switchLogTab = function(tab) {
            document.querySelectorAll(".log-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
            document.querySelectorAll(".log-tab-content").forEach(c => c.classList.remove("active"));
            document.getElementById(tab + "TabContent").classList.add("active");
            if (tab === "history") loadHistory();
        };

        // ========== SCREENSHOT MODAL ==========
        window.openScreenshot = function(src) {
            document.getElementById("screenshotImg").src = src;
            document.getElementById("screenshotModal").classList.add("active");
        };
        window.closeScreenshot = function() {
            document.getElementById("screenshotModal").classList.remove("active");
        };
        document.addEventListener("keydown", e => { if (e.key === "Escape") closeScreenshot(); });

        // ========== UTILS ==========
        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
        window.escapeHtml = escapeHtml;

        function formatDate(d) {
            return d ? new Date(d).toLocaleString("tr-TR") : "-";
        }

    })();
    </script>
</body>
</html>
