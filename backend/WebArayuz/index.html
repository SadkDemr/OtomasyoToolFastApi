<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Test Otomasyon Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; margin-bottom:30px; }
        .stat-card { padding:20px 24px; }
        .stat-card .stat-icon { font-size:2.2rem; margin-bottom:10px; }
        .stat-card .stat-value { font-size:2rem; font-weight:700; line-height:1; }
        .stat-card .stat-label { font-size:0.82rem; color:var(--text-muted); margin-top:6px; }

        .section-title { font-size:1.1rem; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:10px; }

        .quick-actions { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; margin-bottom:30px; }
        .quick-action { padding:20px; text-align:center; cursor:pointer; text-decoration:none; color:var(--text-primary); }
        .quick-action:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--accent-primary); text-decoration:none; }
        .quick-action .qa-icon { font-size:2.5rem; margin-bottom:10px; }
        .quick-action .qa-title { font-weight:600; font-size:0.92rem; }
        .quick-action .qa-desc { font-size:0.78rem; color:var(--text-muted); margin-top:4px; }

        .recent-list { display:flex; flex-direction:column; gap:10px; }
        .recent-item { padding:14px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; }
        .recent-item:hover { background:var(--bg-tertiary); }
        .recent-item .ri-icon { font-size:1.5rem; }
        .recent-item .ri-info { flex:1; }
        .recent-item .ri-name { font-weight:600; font-size:0.9rem; }
        .recent-item .ri-meta { font-size:0.78rem; color:var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 class="page-title">📊 Dashboard</h1>
                </div>
                <div class="header-right">
                    <span style="font-size:0.85rem; color:var(--text-muted);" id="welcomeMsg"></span>
                    <button class="theme-toggle" onclick="Theme.toggle()">🌙</button>
                </div>
            </header>

            <div class="page-content">
                <!-- Stats -->
                <div class="dashboard-grid" id="statsGrid">
                    <div class="card stat-card">
                        <div class="stat-icon">🌐</div>
                        <div class="stat-value" id="webCount">-</div>
                        <div class="stat-label">Web Proje</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon">📲</div>
                        <div class="stat-value" id="mobileCount">-</div>
                        <div class="stat-label">Mobil Proje</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon">🖥️</div>
                        <div class="stat-value" id="desktopCount">-</div>
                        <div class="stat-label">Desktop Proje</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon">📱</div>
                        <div class="stat-value" id="deviceCount">-</div>
                        <div class="stat-label">Bağlı Cihaz</div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="section-title">⚡ Hızlı Erişim</div>
                <div class="quick-actions">
                    <a href="web-test.html" class="card quick-action">
                        <div class="qa-icon">🌐</div>
                        <div class="qa-title">Web Test</div>
                        <div class="qa-desc">Web projelerini aç</div>
                    </a>
                    <a href="mobile-test.html" class="card quick-action">
                        <div class="qa-icon">📲</div>
                        <div class="qa-title">Mobil Test</div>
                        <div class="qa-desc">Mobil projelerini aç</div>
                    </a>
                    <a href="desktop-test.html" class="card quick-action">
                        <div class="qa-icon">🖥️</div>
                        <div class="qa-title">Desktop Test</div>
                        <div class="qa-desc">Desktop otomasyonları</div>
                    </a>
                    <a href="workspace.html" class="card quick-action">
                        <div class="qa-icon">💼</div>
                        <div class="qa-title">Workspace</div>
                        <div class="qa-desc">Git projelerini yönet</div>
                    </a>
                </div>

                <!-- Recent Workspaces -->
                <div class="section-title">📂 Son Çalışmalar</div>
                <div class="recent-list" id="recentList">
                    <div class="card recent-item" style="justify-content:center; color:var(--text-muted);">Yükleniyor...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
    (function() {
        "use strict";

        const TYPE_PAGES = {
            "web": "web-test.html", "web-selenium": "web-test.html",
            "mobile": "mobile-test.html", "mobile-android": "mobile-test.html", "mobile-ios": "mobile-test.html",
            "desktop": "desktop-test.html", "web-desktop": "desktop-test.html"
        };
        const TYPE_ICONS = {
            "web": "🌐", "web-selenium": "🌐", "mobile": "📲", "mobile-android": "📲",
            "mobile-ios": "📱", "desktop": "🖥️", "web-desktop": "🌐🖥️"
        };

        document.addEventListener("DOMContentLoaded", async () => {
            if (!Auth.checkAuth()) return;

            const user = Auth.getUser();
            document.getElementById("welcomeMsg").textContent = `Hoş geldin, ${user?.full_name || user?.username || 'Kullanıcı'}`;

            await loadStats();
        });

        async function loadStats() {
            try {
                const [wsData, devData] = await Promise.all([
                    API.get("/workspaces/my"),
                    API.get("/devices").catch(() => ({ devices: [] }))
                ]);

                const workspaces = wsData.workspaces || [];
                const devices = devData.devices || [];

                const webCount = workspaces.filter(w => ["web", "web-selenium"].includes(w.repository_type)).length;
                const mobileCount = workspaces.filter(w => ["mobile", "mobile-android", "mobile-ios"].includes(w.repository_type)).length;
                const desktopCount = workspaces.filter(w => ["desktop", "web-desktop"].includes(w.repository_type)).length;

                document.getElementById("webCount").textContent = webCount;
                document.getElementById("mobileCount").textContent = mobileCount;
                document.getElementById("desktopCount").textContent = desktopCount;
                document.getElementById("deviceCount").textContent = devices.length;

                renderRecent(workspaces);
            } catch (e) {
                console.error("Stats:", e);
            }
        }

        function renderRecent(workspaces) {
            const list = document.getElementById("recentList");

            if (!workspaces.length) {
                list.innerHTML = `
                    <div class="card recent-item" style="justify-content:center; flex-direction:column; padding:30px; text-align:center;">
                        <div style="font-size:2rem; opacity:0.3; margin-bottom:8px;">💼</div>
                        <div style="color:var(--text-muted);">Henüz workspace yok. <a href="workspace.html">Katalogdan clone edin.</a></div>
                    </div>`;
                return;
            }

            list.innerHTML = workspaces.slice(0, 8).map(ws => {
                const icon = TYPE_ICONS[ws.repository_type] || "📦";
                const page = TYPE_PAGES[ws.repository_type] || "workspace.html";
                return `
                <div class="card recent-item" onclick="window.location.href='${page}'">
                    <div class="ri-icon">${icon}</div>
                    <div class="ri-info">
                        <div class="ri-name">${escapeHtml(ws.repository_name)}</div>
                        <div class="ri-meta">${ws.repository_type || '-'} • ${ws.branch_name || 'main'}</div>
                    </div>
                    <span class="badge ${ws.has_changes ? 'badge-warning' : 'badge-success'}">${ws.has_changes ? '⚠️ Değişiklik' : '✓ Sync'}</span>
                </div>`;
            }).join("");
        }

        function escapeHtml(t) { if (!t) return ""; const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
    })();
    </script>
</body>
</html>
