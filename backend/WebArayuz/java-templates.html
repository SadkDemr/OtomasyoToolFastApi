<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Kalıp Komutlar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .jt-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
        .jt-filter-btn {
            padding:6px 14px; border-radius:999px; border:1px solid var(--border-color);
            background:var(--bg-secondary); color:var(--text-secondary); font-size:0.78rem;
            cursor:pointer; transition:.15s; font-family:inherit;
        }
        .jt-filter-btn:hover { border-color:var(--accent-primary); }
        .jt-filter-btn.active { background:var(--accent-primary); border-color:var(--accent-primary); color:#fff; }

        .jt-section-title { font-size:0.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
        .jt-section-title::after { content:''; flex:1; height:1px; background:var(--border-color); }

        .jt-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; }
        .jt-card { padding:16px 18px; position:relative; }
        .jt-card-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
        .jt-trigger { font-size:0.92rem; font-weight:600; color:var(--text-primary); margin-bottom:8px; line-height:1.4; }
        .jt-code {
            font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:#8888aa;
            background:#1e1e2e; border-radius:8px; padding:10px 12px; margin-bottom:10px;
            max-height:160px; overflow:auto; white-space:pre-wrap; word-break:break-all;
        }
        .jt-meta { font-size:0.72rem; color:var(--text-muted); margin-bottom:10px; }
        .empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); grid-column:1/-1; }
        .empty-icon { font-size:3rem; opacity:.3; margin-bottom:12px; }
        .fm-hint { font-size:0.74rem; color:var(--text-muted); padding:9px 12px; background:var(--bg-tertiary); border-radius:7px; line-height:1.5; margin-bottom:18px; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <header class="header">
            <div class="header-left"><h1 class="page-title">📚 Java Kalıp Komutlar</h1></div>
            <div class="header-right"><button class="theme-toggle" onclick="Theme.toggle()">🌙</button></div>
        </header>

        <div class="page-content">
            <div class="fm-hint">
                Bu kayıtlar admin tarafından tanımlanır ve Java Generator'da bir adım metni birebir
                eşleştiğinde otomatik kullanılır. Sadece görüntüleme — düzenleme yetkisi admin'dedir.
            </div>

            <div class="jt-filters">
                <button class="jt-filter-btn active" data-f="all"     onclick="setFilter('all')">Tümü</button>
                <button class="jt-filter-btn"        data-f="android" onclick="setFilter('android')">🤖 Android</button>
                <button class="jt-filter-btn"        data-f="ios"     onclick="setFilter('ios')">🍎 iOS</button>
            </div>

            <div class="jt-section-title">🔑 Login Blokları</div>
            <div class="jt-grid" id="loginGrid"><div class="empty-state"><div class="empty-icon">🔑</div><p>Yükleniyor...</p></div></div>

            <div class="jt-section-title">📋 Kalıp Step'ler</div>
            <div class="jt-grid" id="stepGrid"><div class="empty-state"><div class="empty-icon">📋</div><p>Yükleniyor...</p></div></div>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script>
(function () {
    "use strict";
    let allTemplates = [];
    let currentFilter = "all";

    document.addEventListener("DOMContentLoaded", () => {
        if (!Auth.checkAuth()) return;
        load();
    });

    async function load() {
        try {
            const data = await API.get("/admin/java-templates");
            allTemplates = data.templates || [];
            render();
        } catch (e) {
            document.getElementById("stepGrid").innerHTML =
                `<div class="empty-state"><p style="color:var(--danger);">Yükleme hatası: ${e.message}</p></div>`;
        }
    }

    window.setFilter = function (f) {
        currentFilter = f;
        document.querySelectorAll(".jt-filter-btn").forEach(b => b.classList.toggle("active", b.dataset.f === f));
        render();
    };

    function render() {
        const list = (currentFilter === "all" ? allTemplates : allTemplates.filter(t => t.platform === currentFilter))
            .filter(t => t.is_active);
        renderGrid("loginGrid", list.filter(t => t.kind === "login"), "🔑", "Login bloğu yok.");
        renderGrid("stepGrid",  list.filter(t => t.kind === "step"),  "📋", "Kalıp step yok.");
    }

    function renderGrid(elId, items, icon, emptyMsg) {
        const grid = document.getElementById(elId);
        if (!items.length) {
            grid.innerHTML = `<div class="empty-state"><div class="empty-icon">${icon}</div><p>${emptyMsg}</p></div>`;
            return;
        }
        grid.innerHTML = items.map((t, i) => {
            const platBadge = t.platform === "ios" ? '<span class="badge" style="background:rgba(0,0,0,.08);color:#555;">🍎 iOS</span>' : '<span class="badge badge-info">🤖 Android</span>';
            const codeId = `${elId}-code-${i}`;
            return `
            <div class="card jt-card">
                <div class="jt-card-head">${platBadge}</div>
                <div class="jt-trigger">${t.kind === "login" ? "🔑 Login Bloğu" : esc(t.trigger_text || "")}</div>
                <div class="jt-code" id="${codeId}">${esc(t.java_code || "")}</div>
                ${t.note ? `<div class="jt-meta">${esc(t.note)}</div>` : ""}
                <button class="btn btn-secondary btn-sm" onclick="copyCode('${codeId}')">📋 Kodu Kopyala</button>
            </div>`;
        }).join("");
    }

    window.copyCode = function (codeId) {
        const el = document.getElementById(codeId);
        if (!el) return;
        navigator.clipboard.writeText(el.textContent || "").then(
            () => Toast.success("Kopyalandı"),
            () => Toast.error("Kopyalanamadı")
        );
    };

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
})();
</script>
</body>
</html>
